irrigation_unlimited:
  refresh_interval: 2000
  controllers:
    - name: Test Controller 1
      zones:
        - name: 'Zone 1'
        - name: 'Zone 2'
      sequences:
        - name: "Seq 1"
          duration: "0:05:00"
          delay: "0:00:00"
          schedules:
            - name: "Morning"
              time: "06:00"
            - name: "Midday"
              time: "12:00"
          zones:
            - zone_id: 1
            - zone_id: 2
  testing:
    enabled: true
    speed: 1.0
    output_events: false
    show_log: false
    autoplay: false
    times:
      - name: '1-Restart inside the window of a waived run'
        start: '2021-01-04 06:03'
        end: '2021-01-04 13:00'
        results:
          - {t: '2021-01-04 12:00:00', c: 1, z: 0, s: 1}
          - {t: '2021-01-04 12:00:00', c: 1, z: 1, s: 1}
          - {t: '2021-01-04 12:05:00', c: 1, z: 1, s: 0}
          - {t: '2021-01-04 12:05:00', c: 1, z: 2, s: 1}
          - {t: '2021-01-04 12:10:00', c: 1, z: 2, s: 0}
          - {t: '2021-01-04 12:10:00', c: 1, z: 0, s: 0}
