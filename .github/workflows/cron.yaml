name: Cron actions

on:
  schedule:
    - cron:  '0 0 * * *'

jobs:
  validate:
    runs-on: "ubuntu-latest"
    name: Validate
    steps:
        - uses: "actions/checkout@v6"

        - name: HACS validation
          # Checks this repo is fit to publish in the HACS store, which a
          # fork is not, and it depends on HACS resolving the repo in its
          # own index. Let it report without failing the job so the
          # hassfest step below still runs
          continue-on-error: true
          uses: "hacs/action@main"
          with:
            category: "integration"
            ignore: brands

        - name: Hassfest validation
          uses: "home-assistant/actions/hassfest@master"